<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlowLog — Skincare Routine Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">GlowLog</p>
    <h1>Your skin, one step at a time.</h1>
    <p class="sub">Log your morning and night skincare routines and see them at a glance.</p>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="add-title">
      <h2 id="add-title">Add a routine</h2>
      <form id="routine-form" novalidate>
        <label>Routine name
          <input name="title" maxlength="100" placeholder="e.g. Weekday glow" required>
        </label>
        <label>When
          <select name="period">
            <option value="morning">☀️ Morning</option>
            <option value="night">🌙 Night</option>
          </select>
        </label>
        <label>Products (in order)
          <textarea name="products" rows="3" placeholder="Cleanser → Toner → Serum → Moisturizer → Sunscreen"></textarea>
        </label>
        <label>Notes
          <textarea name="notes" rows="2" placeholder="Optional"></textarea>
        </label>
        <button type="submit">Save routine</button>
        <p id="msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">My routines</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" data-filter="">All</button>
          <button class="tab" data-filter="morning">☀️ Morning</button>
          <button class="tab" data-filter="night">🌙 Night</button>
        </div>
      </div>
      <ul id="routines" class="routines"></ul>
      <p id="empty" class="empty" hidden>No routines yet. Add your first one!</p>
    </section>
  </main>

  <footer>GlowLog · demo data only — please don't store personal information.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
